name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
        exclude:
          - os: windows-latest
            python-version: '3.14'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch hatchling meson ninja pybind11 semiwrap robotpy-build robotpy-wpiutil robotpy-wpimath robotpy-wpinet robotpy-ntcore robotpy-hal robotpy-wpilibc robotpy-commandsv2 pybind11-stubgen pytest black

    - name: Build
      run: |
        python -m pip install -v -e ".[test]"

    - name: Test
      run: |
        python -m pytest -v
